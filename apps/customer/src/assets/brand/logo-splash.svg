<svg preserveAspectRatio="none" overflow="visible" style="display: block;" width="207" height="134" viewBox="0 0 207 134" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  .bird-eyelid { opacity: 0; }
  @media (prefers-reduced-motion: no-preference) {
    .bird-eye-mask { animation: bird-blink 420ms ease-in-out 900ms 1; }
    .bird-eyelid { animation: bird-lid 420ms ease-in-out 900ms 1; }
  }
  @keyframes bird-blink {
    0%, 100% { transform: translateY(0); }
    43%, 57% { transform: translateY(16px); }
  }
  @keyframes bird-lid {
    0%, 100% { opacity: 0; }
    43%, 57% { opacity: 1; }
  }

  /* Approved approximation of Figma's prototype: words from opposite sides, bird from below. */
  @media (prefers-reduced-motion: no-preference) {
    .splash-zvero { animation: splash-from-left 750ms cubic-bezier(.22, 1, .36, 1) 80ms both; }
    .splash-linka { animation: splash-from-right 750ms cubic-bezier(.22, 1, .36, 1) 80ms both; }
    .splash-bird { animation: splash-from-bottom 750ms cubic-bezier(.22, 1, .36, 1) 150ms both; }
  }
  @keyframes splash-from-left {
    from { transform: translateX(calc(-50vw - 104px)); }
    to { transform: translateX(0); }
  }
  @keyframes splash-from-right {
    from { transform: translateX(calc(50vw + 104px)); }
    to { transform: translateX(0); }
  }
  @keyframes splash-from-bottom {
    from { transform: translateY(calc(50vh + 67px)); }
    to { transform: translateY(0); }
  }
</style>
<defs>
  <mask id="bird-eye-reveal-yellow" maskUnits="userSpaceOnUse" x="150" y="74" width="18" height="19" style="mask-type: luminance">
    <rect class="bird-eye-mask" x="150" y="75.0555" width="18" height="19" fill="white"/>
  </mask>
</defs>

